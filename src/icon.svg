<?xml version="1.0" encoding="UTF-8"?>
<!--
  CSR's mark: an open book inside a speech bubble.

  The two halves of the plugin in one silhouette. The bubble is the ticket — somebody asking — and
  the book inside it is the answer that was already written down. Read as a whole it is the
  argument the plugin makes: the reply is in the library, so nobody should have had to ask.

  Drawn on a 100×100 grid with a 7-unit stroke and round joins, which is what the rest of the
  family uses, so it sits at the same visual weight in the control panel nav.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"
     stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- The bubble, with its tail at the bottom left where a reader's eye lands first. -->
    <path d="M50 12c21 0 38 14 38 31 0 17-17 31-38 31-4 0-8-.5-11.6-1.4L20 88l1.5-19.6C15.6 62.6 12 54.2 12 43 12 26 29 12 50 12Z"/>
    <!-- The spine. -->
    <path d="M50 33v27"/>
    <!-- Two pages opening away from it. -->
    <path d="M50 33c-4.5-3.4-10.4-5-17.6-5H29v27h3.4c7.2 0 13.1 1.6 17.6 5"/>
    <path d="M50 33c4.5-3.4 10.4-5 17.6-5H71v27h-3.4c-7.2 0-13.1 1.6-17.6 5"/>
</svg>
